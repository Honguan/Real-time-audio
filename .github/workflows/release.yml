name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.11"

      - name: Verify release source and version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/verify_release_version.py --version $env:RELEASE_VERSION --github-sha $env:SOURCE_SHA

      - name: Install dependencies
        shell: pwsh
        run: |
          $lock = Get-Content release-lock.json -Raw | ConvertFrom-Json
          $actualHash = (Get-FileHash requirements-release.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $lock.python.requirements_sha256) {
            throw "requirements-release.txt hash mismatch."
          }
          python -m pip install --index-url $lock.python.index_url --require-hashes -r requirements-release.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Run tests
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Build and package release (sign when configured)
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}"
          }
          if ($version -notlike "v*") {
            throw "Release version must start with v, for example v0.1.1."
          }
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Both Authenticode signing secrets must be configured together."
          }
          $certificate = $null
          if ($hasCertificate) {
            $certificate = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          }
          & ./scripts/build.ps1 -SkipInstall
          try {
            $lock = Get-Content release-lock.json -Raw | ConvertFrom-Json
            if ($hasCertificate) {
              & ./scripts/sign_windows.ps1 `
                -Files "dist\RealtimeAudioTranslator\RealtimeAudioTranslator.exe" `
                -CertificatePath $certificate `
                -CertificatePassword $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD `
                -TimestampUrl $lock.installer.timestamp_url
            }
            & ./scripts/package_app_zip.ps1 -Version $version -SkipBuild
            Copy-Item release-lock.json dist-release\RELEASE_MANIFEST.json
            $iscc = & ./scripts/install_inno_setup.ps1 -InstallDir (Join-Path $env:RUNNER_TEMP "inno-setup")
            & ./scripts/build_installer.ps1 -Version $version -IsccPath $iscc
            $installer = Join-Path $PWD "dist-release\RealtimeAudioTranslator-$version-setup.exe"
            if ($hasCertificate) {
              & ./scripts/sign_windows.ps1 `
                -Files $installer `
                -CertificatePath $certificate `
                -CertificatePassword $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD `
                -TimestampUrl $lock.installer.timestamp_url
            }
            & ./scripts/make_checksums.ps1
          } finally {
            if ($certificate) {
              Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("realtime-audio-smoke-" + [guid]::NewGuid())
          $smokeOutput = Join-Path $smokeRoot "result.json"
          $env:REALTIME_AUDIO_HOME = Join-Path $smokeRoot "app-data"
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          $process = Start-Process `
            -FilePath "$env:GITHUB_WORKSPACE\dist\RealtimeAudioTranslator\RealtimeAudioTranslator.exe" `
            -ArgumentList "--smoke-test", "--smoke-output", $smokeOutput `
            -WorkingDirectory $smokeRoot `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $smokeOutput)) {
            throw "Packaged executable smoke test failed with exit code $($process.ExitCode)."
          }
          $result = Get-Content -LiteralPath $smokeOutput -Raw | ConvertFrom-Json
          if ($result.status -ne "ok" -or -not $result.frozen) {
            throw "Packaged executable smoke test reported failure: $($result | ConvertTo-Json -Compress)"
          }
          $result | ConvertTo-Json -Depth 4

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist-release/*.zip
            dist-release/*.exe
            dist-release/LICENSE
            dist-release/THIRD_PARTY_NOTICES.md
            dist-release/THIRD_PARTY_LICENSES.txt
            dist-release/SBOM.cdx.json
            dist-release/RELEASE_MANIFEST.json
            dist-release/SHA256SUMS.txt

      - name: Update Release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.version || github.ref_name }}" --notes-file docs/RELEASE_NOTES.md
