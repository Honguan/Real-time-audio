name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string
      build_runtime:
        description: "Build runtime zip"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      require_runtime_asset:
        description: "Fail release if runtime zip cannot be built"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          $lock = Get-Content release-lock.json -Raw | ConvertFrom-Json
          $actualHash = (Get-FileHash requirements-release.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $lock.python.requirements_sha256) {
            throw "requirements-release.txt hash mismatch."
          }
          python -m pip install --index-url $lock.python.index_url --require-hashes -r requirements-release.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Run tests
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Download Faster-Whisper-XXL runtime
        if: ${{ github.event_name == 'push' || inputs.build_runtime == 'true' }}
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.require_runtime_asset == 'false' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-LockedAsset($Asset, $Destination) {
            Invoke-WebRequest $Asset.url -OutFile $Destination
            $file = Get-Item -LiteralPath $Destination
            $hash = (Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($file.Length -ne $Asset.size -or $hash -ne $Asset.sha256) {
              throw "Release input verification failed: $($Asset.name)"
            }
          }

          $lock = Get-Content release-lock.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path runtime-download, cuda-download, downloaded-runtime | Out-Null
          Get-LockedAsset $lock.runtime[0] runtime-download\runtime.pkg
          Get-LockedAsset $lock.runtime[1] cuda-download\cuda.7z

          $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip not found on runner."
          }
          & $sevenZip x runtime-download\runtime.pkg "-oruntime-download\extracted" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot extract locked Faster-Whisper-XXL runtime."
          }
          & $sevenZip x cuda-download\cuda.7z "-ocuda-download\extracted" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot extract locked CUDA runtime."
          }

          $fw = Get-ChildItem runtime-download\extracted -Recurse -Filter faster-whisper-xxl.exe | Select-Object -First 1
          if (-not $fw) {
            throw "Downloaded runtime does not contain faster-whisper-xxl.exe."
          }
          Copy-Item -Path (Join-Path $fw.Directory.FullName "*") -Destination downloaded-runtime -Recurse -Force
          foreach ($dllName in "cublas64_12.dll", "cublasLt64_12.dll", "cudnn64_9.dll") {
            $dll = Get-ChildItem cuda-download\extracted -Recurse -Filter $dllName | Select-Object -First 1
            if (-not $dll) {
              throw "Cannot find required CUDA DLL: $dllName"
            }
            Copy-Item -LiteralPath $dll.FullName -Destination downloaded-runtime -Force
          }
          New-Item runtime-download\.complete -ItemType File | Out-Null

      - name: Download offline translation models
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-LockedAsset($Asset, $Destination) {
            Invoke-WebRequest $Asset.url -OutFile $Destination
            $file = Get-Item -LiteralPath $Destination
            $hash = (Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($file.Length -ne $Asset.size -or $hash -ne $Asset.sha256) {
              throw "Release input verification failed: $($Asset.name)"
            }
          }

          $lock = Get-Content release-lock.json -Raw | ConvertFrom-Json
          $modelsDir = "translation-models\translation"
          New-Item -ItemType Directory -Path $modelsDir | Out-Null
          foreach ($package in $lock.translation_models.packages) {
            Get-LockedAsset $package (Join-Path $modelsDir $package.name)
          }

      - name: Build release zips
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}"
          }
          if ($version -notlike "v*") {
            throw "Release version must start with v, for example v0.1.1."
          }
          & ./scripts/build.ps1 -SkipInstall
          & ./scripts/package_app_zip.ps1 -Version $version -SkipBuild
          if (Test-Path "runtime-download\.complete") {
            & ./scripts/package_runtime_zip.ps1 -Version $version -RuntimeSource "downloaded-runtime" -SplitRuntime -RuntimeCoreFormat 7z
          }
          & ./scripts/package_models_zip.ps1 -Version $version -ModelsSource "translation-models\translation" -ModelName "translation"
          Copy-Item release-lock.json dist-release\RELEASE_MANIFEST.json
          & ./scripts/make_checksums.ps1

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist-release/*.zip
            dist-release/*.7z
            dist-release/RELEASE_MANIFEST.json
            dist-release/SHA256SUMS.txt

      - name: Update Release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.version || github.ref_name }}" --notes-file docs/RELEASE_NOTES.md
