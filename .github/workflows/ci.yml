name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e .
      - run: .\scripts\test.ps1

  sbom:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.11"
          cache: "pip"
          cache-dependency-path: requirements-release.txt

      - run: python -m pip install --require-hashes -r requirements-release.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip install "cyclonedx-python-lib[validation]==11.12.0"
      - run: python scripts/generate_sbom.py build/sbom-check --verify-installed --validate
