name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e .
      - run: .\scripts\test.ps1

  sbom:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.11"
          cache: "pip"
          cache-dependency-path: requirements-release.txt

      - run: python -m pip install --require-hashes -r requirements-release.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip install "cyclonedx-python-lib[validation]==11.12.0"
      - run: python scripts/generate_sbom.py build/sbom-check --verify-installed --validate

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.11"
          cache: "pip"
          cache-dependency-path: requirements-release.txt

      - run: python -m pip install --require-hashes -r requirements-release.txt
      - run: python -m pip install --no-deps --no-build-isolation .

      - name: Build and test app-only installer
        shell: pwsh
        run: |
          $version = "v" + (python -c "from realtime_audio_translator import __version__; print(__version__)")
          & ./scripts/build.ps1 -SkipInstall
          & ./scripts/package_app_zip.ps1 -Version $version -SkipBuild
          $iscc = & ./scripts/install_inno_setup.ps1 -InstallDir (Join-Path $env:RUNNER_TEMP "inno-setup")
          $installer = & ./scripts/build_installer.ps1 -Version $version -IsccPath $iscc

          $testRoot = Join-Path $env:RUNNER_TEMP ("installer-test-" + [guid]::NewGuid())
          $installRoot = Join-Path $testRoot "app"
          $smokeOutput = Join-Path $testRoot "smoke.json"
          $env:REALTIME_AUDIO_HOME = Join-Path $testRoot "app-data"
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          $install = Start-Process -FilePath $installer `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TYPE=app", "/DIR=$installRoot" `
            -WindowStyle Hidden -Wait -PassThru
          $app = Join-Path $installRoot "RealtimeAudioTranslator.exe"
          if ($install.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $app)) {
            throw "App-only installer test failed: $($install.ExitCode)"
          }
          $smoke = Start-Process -FilePath $app `
            -ArgumentList "--smoke-test", "--smoke-output", $smokeOutput `
            -WorkingDirectory $testRoot -WindowStyle Hidden -Wait -PassThru
          $result = Get-Content -LiteralPath $smokeOutput -Raw | ConvertFrom-Json
          if ($smoke.ExitCode -ne 0 -or $result.status -ne "ok" -or -not $result.frozen) {
            throw "Installed application smoke test failed."
          }

          $userRoot = Join-Path $env:USERPROFILE ".realtime-audio"
          $sentinel = Join-Path $userRoot "unrelated-installer-test.txt"
          New-Item -ItemType Directory -Path $userRoot -Force | Out-Null
          Set-Content -LiteralPath $sentinel -Value "preserve"
          $uninstall = Start-Process -FilePath (Join-Path $installRoot "unins000.exe") `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $app) -or -not (Test-Path -LiteralPath $sentinel)) {
            throw "Installer uninstall safety test failed."
          }
          Remove-Item -LiteralPath $sentinel -Force
