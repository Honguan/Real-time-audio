[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-audio-translator"
dynamic = ["version"]
description = "Windows realtime audio translation application"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ctranslate2>=4.0,<5",
    "google-auth>=2.0",
    "numpy>=1.24",
    "packaging>=24,<27",
    "Pillow>=10.0",
    "PyAudioWPatch>=0.2.12,<0.3",
    "requests>=2.31",
    "sentencepiece>=0.2,<0.3",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.gui-scripts]
realtime-audio-translator = "realtime_audio_translator.gui:main"

[tool.setuptools.dynamic]
version = {attr = "realtime_audio_translator.__version__"}

[tool.setuptools.packages.find]
include = ["realtime_audio_translator*"]
